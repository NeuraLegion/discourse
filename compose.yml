services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DEV_DB: discourse_development
      CHECKOUT_TIMEOUT: "5"
      DATABASE_URL: postgres://postgres:postgres@db:5432/discourse_development
      REDIS_URL: redis://redis:6379/0
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: "6379"
      DISCOURSE_MESSAGE_BUS_REDIS_HOST: redis
      DISCOURSE_MESSAGE_BUS_REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: bash -lc "bundle exec rails db:prepare && exec bundle exec bin/dev"

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db-data:
  redis-data:
