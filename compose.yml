services:
  app:
    build: .
    command: bash -lc "bin/rails db:migrate && exec bundle exec rails server -b 0.0.0.0 -p 3000"
    ports:
      - "3000:3000"
    environment:
      ALLOW_EMBER_CLI_PROXY_BYPASS: "1"
      RAILS_ENV: development
      DISCOURSE_DEV_DB: discourse_development
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: discourse_development
      DISCOURSE_DB_HOST: db
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_MESSAGE_BUS_REDIS_HOST: redis
      SKIP_ENFORCE_HOSTNAME: "1"
      DISCOURSE_LOCAL_EMAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-data:
  redis-data:
