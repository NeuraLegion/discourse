services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: discourse_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-bookworm

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      RAILS_ENV: "development"
      NODE_ENV: "development"
      DISCOURSE_HOSTNAME: "localhost"
      DISCOURSE_SECRET_KEY_BASE: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      DISCOURSE_DEV_DB: "discourse_development"
      PGHOST: "db"
      PGUSER: "postgres"
      PGPASSWORD: "postgres"
      REDIS_URL: "redis://redis:6379"
      DISABLE_MINI_PROFILER: "1"

volumes:
  postgres-data:
