services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "4200:4200"
    environment:
      ALLOW_EMBER_CLI_PROXY_BYPASS: "1"
      RAILS_ENV: development
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DEV_DB: discourse
      DISCOURSE_DB_HOST: db
      DISCOURSE_DB_NAME: discourse
      DISCOURSE_DB_USERNAME: discourse
      DISCOURSE_DB_PASSWORD: discourse
      DISCOURSE_REDIS_HOST: redis
      DISABLE_BOOTSNAP: "1"
      SKIP_DB_AND_REDIS: "1"
    command: >-
      bash -lc 'rm -rf tmp/cache &&
      SKIP_DB_AND_REDIS=1 bundle exec bin/rails db:create db:migrate &&
      SKIP_DB_AND_REDIS=0 bundle exec bin/rails server -b 0.0.0.0 -p 3000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
      POSTGRES_DB: discourse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discourse -d discourse"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db-data:
  redis-data:
