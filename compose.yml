services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
      POSTGRES_DB: discourse
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-bookworm

  app:
    build: .
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: "production"
      DISCOURSE_HOSTNAME: "127.0.0.1"
      DISCOURSE_DB_HOST: "postgres"
      DISCOURSE_DB_NAME: "discourse"
      DISCOURSE_DB_USERNAME: "discourse"
      DISCOURSE_DB_PASSWORD: "discourse"
      DISCOURSE_REDIS_HOST: "redis"
      DISCOURSE_SECRET_KEY_BASE: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    command: bash -lc "bundle exec rails db:prepare && bundle exec rake assets:precompile && bundle exec rails server -b 0.0.0.0 -p 3000"

volumes:
  postgres_data:
