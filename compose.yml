services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      SKIP_DB_AND_REDIS: "1"
      DISCOURSE_HOSTNAME: localhost
      SKIP_ENFORCE_HOSTNAME: "1"
      DISCOURSE_LOCAL_EMAIL_PORT: "1025"
      DISCOURSE_SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DISCOURSE_DB_HOST: db
      DISCOURSE_DB_PORT: "5432"
      DISCOURSE_DB_USERNAME: postgres
      DISCOURSE_DB_PASSWORD: postgres
      DISCOURSE_DEV_DB: discourse_development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    command: >
      bash -lc 'exec bundle exec bin/rails server -b 0.0.0.0 -p 3000'

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-data:
  redis-data:
