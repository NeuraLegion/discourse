services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: discourse
      POSTGRES_PASSWORD: discourse
      POSTGRES_DB: discourse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discourse -d discourse"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-bookworm
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: "production"
      RACK_ENV: "production"
      NODE_ENV: "development"
      DISCOURSE_HOSTNAME: "localhost"
      DISCOURSE_DB_HOST: "db"
      DISCOURSE_DB_NAME: "discourse"
      DISCOURSE_DB_USERNAME: "discourse"
      DISCOURSE_DB_PASSWORD: "discourse"
      DISCOURSE_REDIS_HOST: "redis"
      DISCOURSE_MESSAGE_BUS_REDIS_HOST: "redis"
      RUBY_BIND: "0.0.0.0"
    command: >-
      bash -lc 'export PATH=/app/bin:/app/node_modules/.bin:/usr/local/share/pnpm:/usr/local/node/bin:$PATH &&
      bundle exec rails db:prepare &&
      bundle exec ruby -e "ENV[\"RAILS_ENV\"] ||= \"production\"; ENV[\"RACK_ENV\"] ||= \"production\"; require \"./config/environment\"; require \"rack/server\"; Rack::Server.start(app: Rails.application, Host: \"0.0.0.0\", Port: 3000)"'

volumes:
  postgres-data:
