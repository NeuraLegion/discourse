services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  app:
    build: .
    ports:
      - "3000:3000"
      - "4200:4200"
    environment:
      RAILS_ENV: development
      DISCOURSE_HOSTNAME: discourse.local
      DISCOURSE_DEV_DB: discourse_development
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: "6379"
      DISCOURSE_REDIS_DB: "0"
      UNICORN_BIND_ALL: "true"
      LOAD_PLUGINS: "0"
      DISCOURSE_LOCAL_EMAIL_PORT: "1025"
      ALLOW_EMBER_CLI_PROXY_BYPASS: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db-data:
  redis-data:
