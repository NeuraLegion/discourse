services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DISCOURSE_DEV_DB: discourse_development
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DB_HOST: db
      DISCOURSE_DB_PORT: "5432"
      DISCOURSE_DB_NAME: discourse_development
      DISCOURSE_DB_USERNAME: postgres
      DISCOURSE_DB_PASSWORD: postgres
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: "6379"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: discourse_development
      UNICORN_BIND_ALL: "true"
      SKIP_ENFORCE_HOSTNAME: "1"
      LOAD_PLUGINS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -lc "bundle exec rake db:migrate && bundle exec rails assets:precompile && bundle exec rails server -b 0.0.0.0 -p 3000"
    stdin_open: true
    tty: true

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  db-data:
  redis-data:
