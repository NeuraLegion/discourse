services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DISCOURSE_SKIP_PLUGINS: discourse-ai
      RAILS_ENV: development
      DISCOURSE_DEV_DB: discourse_development
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_SKIP_CSS_WATCHER: "1"
      DB_HOST: db
      DB_PORT: "5432"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: discourse_development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DISCOURSE_DB_HOST: db
      DISCOURSE_DB_PORT: "5432"
      DISCOURSE_DB_NAME: discourse_development
      DISCOURSE_DB_USERNAME: postgres
      DISCOURSE_DB_PASSWORD: postgres
      DISCOURSE_REDIS_HOST: redis
      DISCOURSE_REDIS_PORT: "6379"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SKIP_ENFORCE_HOSTNAME: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db-data:
  redis-data:
