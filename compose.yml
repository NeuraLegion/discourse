services:
  app:
    build: .
    ports:
      - "3000:3000"
      - "4200:4200"
    environment:
      RAILS_ENV: "development"
      NODE_ENV: "development"
      DISCOURSE_HOSTNAME: "0.0.0.0"
      UNICORN_BIND_ALL: "true"
      DISCOURSE_USE_SMTP_ENVIRONMENT_IN_DEVELOPMENT: "false"
      DISCOURSE_DEV_DB: "discourse_development"
      DISCOURSE_DB_HOST: "db"
      DISCOURSE_DB_NAME: "discourse_development"
      DISCOURSE_DB_USERNAME: "postgres"
      DISCOURSE_DB_PASSWORD: "postgres"
      PGHOST: "db"
      PGUSER: "postgres"
      PGPASSWORD: "postgres"
      PGPORT: "5432"
      DISCOURSE_REDIS_HOST: "redis"
      DISCOURSE_REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "discourse_development"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discourse_development"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-bookworm

volumes:
  postgres-data:
