services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: discourse_development
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      DISCOURSE_HOSTNAME: localhost
      DISCOURSE_DEV_DB: discourse_development
      CHECKOUT_TIMEOUT: "5"
      ALLOW_DEV_POPULATE: "1"
      ALLOW_EMBER_CLI_PROXY_BYPASS: "1"
      DATABASE_URL: postgres://postgres:postgres@db:5432/discourse_development
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      RUBY_BIND: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  db-data:
  redis-data:
