services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: production
      RACK_ENV: production
      NODE_ENV: production
      DISCOURSE_RUNNING_IN_RACK: "1"
    command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3000"]
